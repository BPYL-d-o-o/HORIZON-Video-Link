# hz_vtx settings for the Horizon video link transmitter service (sh /userdata/horizon_vtx/service.sh restart to apply).
# Run /userdata/horizon_vtx/hz_vtx --help for all options. RF frequency is the RP2350 firmware's boot value (868 MHz),
# changed at run time from the receiver. TX power: the firmware boots at -9.5 dBm (minimum: the bench boards run from the
# Pi 5's USB ports, and 22 dBm tripped its over-current protection). Change it from the Luckfox with
#   sh /userdata/horizon_vtx/service.sh power 20         (0.5 dBm units, -19..44 = -9.5..22 dBm; or e.g. 10dbm)
#   sh /userdata/horizon_vtx/service.sh power 44 save    (also adds --tx-power 44 below = applied at every start)
# or from the receiver over the air, as before. Both show the same value (the TX announces it downlink).
#
# Format v4 (needs vlive_tx_luckfox.uf2 / vlive_rx.uf2 of format v4, 2026-11-18 or later):
#   radio   SF5 / 1 MHz / long-interleaver 4/5, 255-byte packets, 17.54 ms slots (one fixed frequency, or hopping)
#   packets every packet carries 231 bytes of video + CRC-16 + RS(253,237) (damaged packets are repaired at the
#           receiver)
#   FEC     block FEC 8,4 by default, as the Pi sender (the OpenIPC / wfb-ng style 8+4): 4 parity packets after every
#           8 video packets, the receivers rebuild up to 4 lost packets per block. Costs airtime: the video bitrate is
#           8/12 of the link. Other values with --fec K,M[,D] in HZ_ARGS (16,3 = more video, less protection; D > 1
#           interleaves D blocks against longer fades), --fec off for none
#   video   576x320 at up to 30 fps from the free-running camera, one hardware encode per frame (stock CBR, the whole
#           link: --util 1.0), a keyframe every 2 s (--keyint 60, fixed keyframe QP 44), SAO off, CU delta-QP 0.
#           Chosen by VMAF over three test clips and seven loss models (dev/luckfox_lab.py, 2026-11-22); with FEC
#           16,3: VMAF 28.9 clean and 26.4 at 5 % packet loss, against 21.8 and 5.4 for the old 288x160 row refresh
#   headers VPS/SPS/PPS repeated every 2 s (the default --header-every 2), with each keyframe
#   ident   the RP2350 keeps a callsign (set from the receiver, or add --callsign <text> here) and sends it every 5 minutes in
#           a command slot; `service.sh stop` makes it identify once more and then stop transmitting
HZ_ARGS="--tx-power -19"
