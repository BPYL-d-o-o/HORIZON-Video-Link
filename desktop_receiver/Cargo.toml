[package]
name = "horizon_receiver"
version = "0.1.0"
edition = "2021"
description = "Horizon Receiver: the Horizon video link's desktop receiver (Tauri test build)"
license = "MIT"

[lib]
name = "horizon_receiver"
crate-type = ["rlib"]

[[bin]]
name = "horizon_receiver"
path = "src/main.rs"

# test tools (desktop_receiver/test/): not part of the app
[[bin]]
name = "engine_check"
path = "test/engine_check.rs"

[[bin]]
name = "hold_check"
path = "test/hold_check.rs"

[[bin]]
name = "grey_stats"
path = "test/grey_stats.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
libloading = "0.8"
sha1_smol = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance",
  "Win32_System_Threading", "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
